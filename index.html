<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9eff6">
  <meta name="description" content="반짝이는 순간을 모아둔 샤콰의 작은 메이플 공간.">
  <title>샤콰 · 작은 반짝임의 방</title>
  <link rel="icon" href="assets/shakua.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="./"><span aria-hidden="true">♡</span> shakua.room</a><span class="top-note">a tiny place for lovely things ✦</span></header>
    <main>
      <section class="room" aria-labelledby="name">
        <div class="intro">
          <p class="eyebrow">MY MAPLE ROOM</p>
          <h1 id="name">샤콰<span aria-hidden="true">✧</span></h1>
          <p class="roman">S H A K U A</p>
          <p class="greeting">작은 반짝임이 모이는 곳.<br>반짝이는 것들을 주워 담으며 사는 중 ✦</p>
          <nav aria-label="샤콰의 바로가기">
            <a href="https://meaegi.com/s/%EC%83%A4%EC%BD%B0" target="_blank" rel="noopener noreferrer"><span class="link-no">01</span><span>메애기</span><span class="arrow" aria-hidden="true">↗</span></a>
            <a href="https://maplescouter.com/ko/info?name=%EC%83%A4%EC%BD%B0" target="_blank" rel="noopener noreferrer"><span class="link-no">02</span><span>환산주스탯</span><span class="arrow" aria-hidden="true">↗</span></a>
            <a href="https://www.instagram.com/apple_shakua" target="_blank" rel="noopener noreferrer"><span class="link-no">03</span><span>Instagram</span><span class="arrow" aria-hidden="true">↗</span></a>
            <a href="https://open.kakao.com/o/sVNk0sRh" target="_blank" rel="noopener noreferrer"><span class="link-no">04</span><span>카카오톡</span><span class="arrow" aria-hidden="true">↗</span></a>
          </nav>
          <a class="instagram-card" href="https://www.instagram.com/apple_shakua" target="_blank" rel="noopener noreferrer" aria-label="샤콰 인스타그램 apple_shakua 열기">
            <img src="assets/instagram-qr.png" alt="샤콰 인스타그램으로 연결되는 QR 코드" width="370" height="370">
            <span class="qr-copy"><span class="qr-heading">INSTAGRAM</span><span class="qr-handle">@apple_shakua</span><span class="qr-hint">스캔해서 만나기 ♡</span></span>
          </a>
        </div>
        <div class="portrait-area">
          <div class="floating-note">오늘도 반짝이는 하루 <span aria-hidden="true">✧</span></div>
          <figure class="window illustration-window">
            <div class="titlebar"><span><span aria-hidden="true">♡</span> shakua — illustration</span><span class="window-marks" aria-hidden="true">— &nbsp; □ &nbsp; ×</span></div>
            <div class="anime-portrait"><img src="assets/shakua-portrait-user.png" alt="은빛 머리와 분홍 눈의 샤콰가 리본 장식 책을 안고 있는 일러스트" width="1254" height="1254" fetchpriority="high"></div>
            <figcaption><span>샤콰의 반짝이는 순간</span><span aria-hidden="true">♡</span></figcaption>
          </figure>
          <figure class="window pixel-window">
            <div class="titlebar"><span><span aria-hidden="true">♡</span> shakua.png</span><span class="window-marks" aria-hidden="true">— &nbsp; □ &nbsp; ×</span></div>
            <div class="portrait">
              <span class="corner-label">MY LITTLE CHARACTER</span>
              <span class="spark spark-one" aria-hidden="true">✧</span><span class="spark spark-two" aria-hidden="true">✦</span><span class="spark spark-three" aria-hidden="true">+</span>
              <div class="character-crop"><img src="assets/shakua.png" alt="은빛 긴 머리와 분홍빛 눈, 파스텔 보닛을 쓴 샤콰의 픽셀 캐릭터" width="1200" height="1200" draggable="false"></div>
              <span class="name-tag">♡ &nbsp; 샤콰 &nbsp; ♡</span>
            </div>
            <figcaption><span>소중한 나의 메애기</span><span aria-hidden="true">♥</span></figcaption>
          </figure>
          <div class="under-note">little songs, tiny sparkles <span aria-hidden="true">✦</span></div>
          <section class="music-player" aria-label="샤콰의 음악 플레이어">
            <div class="music-main">
              <select id="music-track" aria-label="곡 선택"><option value="0">아쿠아리움</option><option value="1">루디브리엄</option><option value="2">발로라</option><option value="3">차원의 도서관</option></select>
              <button id="music-prev" type="button" aria-label="이전 곡" title="이전 곡"><svg class="" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17 6 8 12l9 6z" fill="currentColor"/><rect x="5" y="6" width="2" height="12" rx=".7" fill="currentColor"/></svg></button>
              <button id="music-play" class="play-button" type="button" aria-label="재생" title="재생" data-playing="false"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.5v13L19 12z" fill="currentColor"/></svg><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
              <button id="music-next" type="button" aria-label="다음 곡" title="다음 곡"><svg class="" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 6 9 6-9 6z" fill="currentColor"/><rect x="17" y="6" width="2" height="12" rx=".7" fill="currentColor"/></svg></button>
              <button id="music-repeat" type="button" aria-pressed="false" aria-label="한 곡 반복 켜기" title="한 곡 반복 켜기"><svg class="" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-3v4a3 3 0 0 1-3 3H3"/><path d="m10.5 10 1.5-1v6m-1.5 0h3"/></g></svg></button>
            </div>
            <div class="music-bottom"><span id="elapsed">0:00</span><input id="music-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="재생 위치" disabled><label class="volume-label"><svg class="" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9h4l5-4v14l-5-4H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input id="music-volume" type="range" min="0" max="100" value="40" aria-label="음량"></label><a id="music-source" href="https://maplestory.nexon.com/Media/Music" target="_blank" rel="noopener noreferrer" aria-label="현재 곡 음원 출처" title="Music © NEXON / NECORD · 음원 출처">ⓘ</a></div>
            <p id="music-status" role="status" hidden></p>
            <audio id="music-audio" preload="metadata"></audio>
          </section>
        </div>
      </section>
    </main>
    <footer><span>샤콰의 작은 공간</span><span class="footer-heart" aria-hidden="true">♡</span><span>gathering little bits of stardust ✦</span></footer>
  </div>
  <script src="music.js" defer></script>

</html>
